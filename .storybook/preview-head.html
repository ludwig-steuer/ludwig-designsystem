<!-- Die Schriften selbst lädt `src/styles/index.css` (@import) — sie müssen in
     der Style-Kette stehen, weil außerhalb von Storybook nur die geladen wird.
     Hier bleiben nur die Verbindungs-Hints, die den Abruf beschleunigen. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- The app renders `<html lang="de">`; without it `hyphens: auto` does nothing
     here, and a story would measure other line breaks than the app shows. -->
<script>document.documentElement.lang = "de";</script>
