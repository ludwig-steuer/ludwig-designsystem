<!doctype html>
<html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<style>
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 13px; font-weight: 500; color: var(--color-text); }
  .field .hint { font-size: 12px; color: var(--color-text-muted); }
  .field .err { font-size: 12px; color: #A8403C; }
  .input, .select {
    font-family: var(--font-sans); font-size: 14px; color: var(--color-text);
    padding: 9px 12px; border: 1px solid #DDE2E8; border-radius: 4px; background: #fff;
    width: 100%; line-height: 1.4; transition: border-color 120ms, box-shadow 120ms;
  }
  .input:hover { border-color: #C4CCD5; }
  .input:focus { outline: none; border-color: #3B8FC4; box-shadow: 0 0 0 3px rgba(59,143,196,0.18); }
  .input.error { border-color: #A8403C; }
  .input.error:focus { box-shadow: 0 0 0 3px rgba(168,64,60,0.18); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .checkbox-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .checkbox { width: 16px; height: 16px; border: 1px solid #C4CCD5; border-radius: 2px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .checkbox.checked { background: #1A3A5C; border-color: #1A3A5C; }
  .checkbox.checked::after { content: ""; width: 8px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
</style>
<div class="grid2">
  <div class="field">
    <label>Mandanten-Nummer</label>
    <input class="input lw-numeric" value="10024" />
    <div class="hint">5–7 Ziffern, eindeutig in der Kanzlei</div>
  </div>
  <div class="field">
    <label>USt-Satz</label>
    <select class="select"><option>19 %</option><option>7 %</option><option>0 %</option></select>
  </div>
</div>
<div class="field">
  <label>Beschreibung</label>
  <input class="input" value="Bürobedarf — Rechnung 2026/04/118" />
</div>
<div class="field">
  <label>Konto</label>
  <input class="input error" value="0000" />
  <div class="err">Konto nicht im SKR03 enthalten. Bitte gültige Kontonummer eingeben.</div>
</div>
<div class="checkbox-row"><span class="checkbox checked"></span><span style="font-size:14px">Vor dem Export erneut prüfen</span></div>
<div class="checkbox-row"><span class="checkbox"></span><span style="font-size:14px">DATEV-Periode automatisch übernehmen</span></div>
</div></body></html>
