<!doctype html>
<html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<style>
  .row-sp { display: grid; grid-template-columns: 100px 60px 1fr; gap: 14px; align-items: center; padding: 6px 0; }
  .name { font-family: var(--font-mono); font-size: 12px; color: var(--color-text); }
  .px { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-subtle); text-align: right; }
  .bar { height: 14px; background: #1A3A5C; border-radius: 2px; }
</style>
<div class="row-sp"><div class="name">--space-1</div><div class="px">4 px</div><div><div class="bar" style="width:4px"></div></div></div>
<div class="row-sp"><div class="name">--space-2</div><div class="px">8 px</div><div><div class="bar" style="width:8px"></div></div></div>
<div class="row-sp"><div class="name">--space-3</div><div class="px">12 px</div><div><div class="bar" style="width:12px"></div></div></div>
<div class="row-sp"><div class="name">--space-4</div><div class="px">16 px</div><div><div class="bar" style="width:16px"></div></div></div>
<div class="row-sp"><div class="name">--space-5</div><div class="px">20 px</div><div><div class="bar" style="width:20px"></div></div></div>
<div class="row-sp"><div class="name">--space-6</div><div class="px">24 px</div><div><div class="bar" style="width:24px"></div></div></div>
<div class="row-sp"><div class="name">--space-8</div><div class="px">32 px</div><div><div class="bar" style="width:32px"></div></div></div>
<div class="row-sp"><div class="name">--space-10</div><div class="px">40 px</div><div><div class="bar" style="width:40px"></div></div></div>
<div class="row-sp"><div class="name">--space-12</div><div class="px">48 px</div><div><div class="bar" style="width:48px"></div></div></div>
<div class="row-sp"><div class="name">--space-16</div><div class="px">64 px</div><div><div class="bar" style="width:64px"></div></div></div>
<div class="row-sp"><div class="name">--space-20</div><div class="px">80 px</div><div><div class="bar" style="width:80px"></div></div></div>
<div class="row-sp"><div class="name">--space-24</div><div class="px">96 px</div><div><div class="bar" style="width:96px"></div></div></div>
</div></body></html>
