<!doctype html>
<html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<style>
  .badges { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 0; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px;
    border: 1px solid transparent; line-height: 1.4;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 999px; }
  .b-neutral { background: #ECEFF3; color: #2D2D2D; border-color: #DDE2E8; }
  .b-info { background: #E3F0F8; color: #2E78A8; border-color: #C7DFEC; }
  .b-success { background: #EBF2EE; color: #3F7A5A; border-color: #D5E3DB; }
  .b-warning { background: #F5EEE0; color: #B07B2C; border-color: #E8DCBE; }
  .b-danger { background: #F4E6E5; color: #A8403C; border-color: #E5C9C7; }
  .b-primary { background: #1A3A5C; color: #fff; }
  .label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-subtle); font-weight: 600; margin: 14px 0 4px; }
</style>
<div class="label">Status-Badges (Vorgang)</div>
<div class="badges">
  <span class="badge b-neutral"><span class="dot" style="background:#8A8A8A"></span>Entwurf</span>
  <span class="badge b-info"><span class="dot" style="background:#3B8FC4"></span>In Prüfung</span>
  <span class="badge b-warning"><span class="dot" style="background:#B07B2C"></span>Rückfrage</span>
  <span class="badge b-success"><span class="dot" style="background:#3F7A5A"></span>Geprüft</span>
  <span class="badge b-success"><span class="dot" style="background:#3F7A5A"></span>Exportiert</span>
  <span class="badge b-danger"><span class="dot" style="background:#A8403C"></span>Fehler</span>
</div>
<div class="label">Tags</div>
<div class="badges">
  <span class="badge b-neutral">USt 19 %</span>
  <span class="badge b-neutral">SKR03</span>
  <span class="badge b-neutral">Eingangsrechnung</span>
  <span class="badge b-primary">Ludwig</span>
  <span class="badge b-info">Automatisch erkannt</span>
</div>
<div class="label">Kontoanzeige</div>
<div class="badges">
  <span class="badge b-neutral lw-mono" style="font-family: var(--font-mono); padding: 4px 10px;">8400 · Erlöse 19 %</span>
  <span class="badge b-neutral lw-mono" style="font-family: var(--font-mono); padding: 4px 10px;">4980 · Bürobedarf</span>
</div>
</div></body></html>
