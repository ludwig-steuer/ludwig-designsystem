<!doctype html>
<html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<style>
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .sw .chip { height: 64px; border-radius: 4px; border: 1px solid #DDE2E8; }
  .sw .name { font-size: 12px; font-weight: 600; color: var(--color-text); }
  .sw .hex { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-subtle); }
  .row-section { display: flex; flex-direction: column; gap: 14px; }
  .row-section + .row-section { margin-top: 18px; }
  .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .header h4 { margin: 0; font-size: 13px; font-weight: 600; color: var(--color-text); }
  .header span { font-size: 11px; color: var(--color-text-subtle); letter-spacing: 0.04em; text-transform: uppercase; }
</style>
<div class="row-section">
  <div class="header"><h4>Text — Anthrazit (nie reines Schwarz)</h4><span>Body · Muted · Subtle</span></div>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#2D2D2D"></div><div class="name">text · base</div><div class="hex">#2D2D2D</div></div>
    <div class="sw"><div class="chip" style="background:#5C5C5C"></div><div class="name">text-muted</div><div class="hex">#5C5C5C</div></div>
    <div class="sw"><div class="chip" style="background:#8A8A8A"></div><div class="name">text-subtle</div><div class="hex">#8A8A8A</div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="name">on-dark</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:#B8C5D3"></div><div class="name">on-dark-muted</div><div class="hex">#B8C5D3</div></div>
  </div>
</div>
<div class="row-section">
  <div class="header"><h4>Surface &amp; Border</h4><span>Hintergründe · Trenner</span></div>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="name">bg / surface</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:#F4F6F8"></div><div class="name">bg-soft</div><div class="hex">#F4F6F8</div></div>
    <div class="sw"><div class="chip" style="background:#ECEFF3"></div><div class="name">bg-sunken</div><div class="hex">#ECEFF3</div></div>
    <div class="sw"><div class="chip" style="background:#DDE2E8"></div><div class="name">border</div><div class="hex">#DDE2E8</div></div>
    <div class="sw"><div class="chip" style="background:#C4CCD5"></div><div class="name">border-strong</div><div class="hex">#C4CCD5</div></div>
  </div>
</div>
</div></body></html>
