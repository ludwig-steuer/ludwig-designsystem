<!doctype html>
<html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<style>
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #ECEFF3; }
  th { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-subtle); font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums lining-nums; text-align: right; color: var(--color-primary); font-weight: 500; }
  td.acct { font-family: var(--font-mono); font-size: 13px; color: var(--color-text); }
  .legend { margin-top: 14px; display: flex; gap: 20px; font-size: 12px; color: var(--color-text-subtle); }
  .legend strong { color: var(--color-text); }
</style>
<table>
  <thead><tr><th>Konto</th><th>Bezeichnung</th><th style="text-align:right">Betrag</th><th style="text-align:right">USt</th></tr></thead>
  <tbody>
    <tr><td class="acct">8400</td><td>Erlöse 19 % USt</td><td class="num">12.480,00 €</td><td class="num">2.371,20 €</td></tr>
    <tr><td class="acct">8300</td><td>Erlöse 7 % USt</td><td class="num">1.247,50 €</td><td class="num">87,33 €</td></tr>
    <tr><td class="acct">4980</td><td>Bürobedarf</td><td class="num">348,90 €</td><td class="num">66,29 €</td></tr>
    <tr><td class="acct">4100</td><td>Löhne und Gehälter</td><td class="num">8.420,00 €</td><td class="num">—</td></tr>
  </tbody>
</table>
<div class="legend">
  <span><strong>Inter</strong> · Tabular-Numerals (tnum)</span>
  <span><strong>JetBrains Mono</strong> · Konten + DATEV-Codes</span>
</div>
</div></body></html>
