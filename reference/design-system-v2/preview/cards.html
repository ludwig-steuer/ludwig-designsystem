<!doctype html>
<html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background: linear-gradient(180deg, #FAFBFD 0%, #F4F6F8 100%);">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .surface {
    background: linear-gradient(180deg,#FFFFFF 0%,#FAFBFC 100%);
    border: 1px solid #DDE2E8; border-radius: 8px; padding: 18px 20px;
    box-shadow: 0 1px 2px rgba(20,36,56,0.04), 0 4px 12px rgba(20,36,56,0.05), inset 0 1px 0 rgba(255,255,255,0.8);
  }
  .surface-glow {
    background: linear-gradient(180deg,#FFFFFF 0%,#FAFBFC 100%);
    border-radius: 8px; padding: 18px 20px;
    box-shadow:
      0 0 0 1px rgba(59,143,196,0.30),
      0 0 0 5px rgba(59,143,196,0.10),
      0 8px 24px rgba(26,58,92,0.10),
      inset 0 1px 0 rgba(255,255,255,0.8);
  }
  .surface-header { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid #ECEFF3; }
  .surface-header .title { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-subtle); font-weight: 600; }
  .surface-header .meta { font-size: 12px; color: var(--color-text-muted); }
  .stat-num { font-family: 'Source Serif 4', Georgia, serif; font-weight: 500; font-size: 36px; color: #1A3A5C; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 13px; color: var(--color-text-muted); margin-top: 6px; }
  .stat-trend { font-size: 12px; color: #3F7A5A; margin-top: 8px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: rgba(59,143,196,0.12); color: #2E78A8; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; }
</style>
<div class="grid">
  <div class="surface">
    <div class="surface-header"><span class="title">Heute vorkontiert</span><span class="meta">24.04.</span></div>
    <div class="stat-num">47</div>
    <div class="stat-label">Belege bereit zur Prüfung</div>
    <div class="stat-trend">+12 gegenüber Vortag</div>
  </div>
  <div class="surface-glow">
    <div class="surface-header"><span class="title">Aktiv · Mandant Berger GmbH<span class="badge" style="margin-left:8px">Live</span></span><span class="meta">10024</span></div>
    <div style="font-size:14px; line-height:1.6">
      <div style="display:flex; justify-content:space-between"><span style="color:#5C5C5C">Offene Vorgänge</span><span class="lw-numeric" style="font-weight:500">23</span></div>
      <div style="display:flex; justify-content:space-between"><span style="color:#5C5C5C">USt-Voranmeldung</span><span style="color:#3F7A5A; font-weight:500">Bereit</span></div>
      <div style="display:flex; justify-content:space-between"><span style="color:#5C5C5C">Letzter Export</span><span class="lw-numeric">31.03.2026</span></div>
    </div>
  </div>
</div>
</div></body></html>
