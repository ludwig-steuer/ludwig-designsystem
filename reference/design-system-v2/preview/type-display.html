<!doctype html>
<html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<style>
  .row-spec { display: grid; grid-template-columns: 1fr 110px; gap: 16px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid #ECEFF3; }
  .row-spec:last-child { border-bottom: none; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-subtle); text-align: right; }
  .specimen { color: var(--color-primary); }
</style>
<div class="row-spec">
  <div class="specimen lw-display" style="font-size:44px">Mehr Zeit für Mandanten.</div>
  <div class="meta">Display · Serif 500<br>56 / 1.08</div>
</div>
<div class="row-spec">
  <div class="specimen lw-h1" style="font-size:32px">Belege prüfen und freigeben</div>
  <div class="meta">H1 · Sans 600<br>40 / 1.15</div>
</div>
<div class="row-spec">
  <div class="specimen lw-h2" style="font-size:24px">Offene Vorgänge</div>
  <div class="meta">H2 · Sans 600<br>30 / 1.22</div>
</div>
<div class="row-spec">
  <div class="specimen lw-h3" style="font-size:20px; color: var(--color-text)">Mandant Berger GmbH</div>
  <div class="meta">H3 · Sans 600<br>22 / 1.30</div>
</div>
<div class="row-spec">
  <div class="specimen lw-h4" style="color: var(--color-text)">Umsatzsteuer-Vorkontierung</div>
  <div class="meta">H4 · Sans 600<br>18 / 1.35</div>
</div>
</div></body></html>
