<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="max-height:400px;overflow-y:auto;">
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="12">
    <div onClick="{{ it.select }}" style-hover="filter:brightness(0.96);" style="cursor:{{ it.cursorStyle }};background:{{ it.rowBg }};border:1px solid {{ it.rowBorder }};border-radius:var(--radius-md);padding:9px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;">
      <div style="min-width:0;flex:1;">
        <div style="font-size:13px;font-weight:600;color:var(--color-text);">{{ it.title }}</div>
        <div style="font-size:11.5px;color:var(--color-text-muted);margin-top:1px;">{{ it.sub }}</div>
      </div>
      <span style="width:76px;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--color-text);">{{ it.amountText }}</span>
      <span style="width:88px;text-align:center;font-size:14px;font-weight:700;color:{{ it.zugeordnetColor }};">{{ it.zugeordnetIcon }}</span>
      <span style="width:88px;text-align:center;font-size:14px;font-weight:700;color:{{ it.gebuchtColor }};">{{ it.gebuchtIcon }}</span>
    </div>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 480, &quot;height&quot;: 400}, &quot;items&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;Array&lt;{title: string, sub: string, amountText: string, zugeordnetIcon: string, zugeordnetColor: string, gebuchtIcon: string, gebuchtColor: string, select: () =&gt; void, cursorStyle: string, rowBg: string, rowBorder: string}&gt;&quot;}}"></script>
</body>
</html>
