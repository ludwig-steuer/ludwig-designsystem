<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="display:flex;gap:4px;flex-wrap:wrap;">
  <sc-for list="{{ scenarios }}" as="sce" hint-placeholder-count="6">
    <button onClick="{{ sce.pick }}" title="{{ sce.title }}" style-hover="filter:brightness(0.96);" style="border:1px solid {{ sce.border }};background:{{ sce.bg }};color:{{ sce.color }};border-radius:var(--radius-md);padding:5px 10px;font-size:11.5px;font-weight:600;cursor:pointer;">{{ sce.label }}</button>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 32}, &quot;scenarios&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;Array&lt;{label: string, pick: () =&gt; void, title?: string, border: string, bg: string, color: string}&gt;&quot;}}"></script>
</body>
</html>
