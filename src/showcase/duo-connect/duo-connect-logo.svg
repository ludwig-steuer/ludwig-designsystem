<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" role="img" aria-label="Ludwig DUO-Connect">
  <!-- Ludwig mark (designsystem reference/design-system-v2/assets/ludwig-mark.svg): same tile, same L.
       The blue crossbar becomes two harpoons (⇌): documents to Ludwig, booked documents back.
       Use from 32 px up; 16 px has its own pixel drawing (duo-connect-logo-16.svg). -->
  <defs>
    <linearGradient id="lwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#224A73"/>
      <stop offset="100%" stop-color="#142B45"/>
    </linearGradient>
    <linearGradient id="lwStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7DFEC" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="56" height="56" rx="12" fill="url(#lwBg)"/>
  <rect width="56" height="28" rx="12" fill="#FFFFFF" fill-opacity="0.05"/>
  <path d="M16 12 L16 41 Q16 43 18 43 L40 43" fill="none" stroke="url(#lwStroke)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="#5BA4D1" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23 20 H40 L34.5 14.5"/>
    <path d="M40 31 H23 L28.5 36.5"/>
  </g>
</svg>
